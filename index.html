<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>Genius in Saint Petersburg</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" crossorigin href="./assets/index-D5pLFmJk.css">
    <style>
      #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:9999;font-family:Georgia,serif}
      #gate form{display:flex;flex-direction:column;gap:12px;width:min(300px,86vw);color:#efe6d6;text-align:center}
      #gate input,#gate button{font:inherit;font-size:18px;padding:12px;border-radius:8px;border:1px solid #555;background:#1c1c1c;color:#efe6d6}
      #gate button{background:#efe6d6;color:#111;cursor:pointer}
      #gate .err{color:#e57373;min-height:1.2em;font-size:14px}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="gate"><form>
      <div style="font-size:22px">Genius in Saint Petersburg</div>
      <input type="password" placeholder="Пароль" autofocus autocomplete="current-password" />
      <button>Играть</button>
      <div class="err"></div>
    </form></div>
    <script type="module">
      const gate = document.getElementById('gate'), form = gate.querySelector('form'),
        input = form.querySelector('input'), btn = form.querySelector('button'), err = form.querySelector('.err');
      const data = fetch('./assets/game.bin').then(r => r.arrayBuffer());
      async function unlock(pw) {
        const buf = new Uint8Array(await data);
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 250000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const js = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
        try { localStorage.setItem('gspb-pw', pw) } catch {}
        // пока игра грузится — афоризм (случайный из пяти), гаснет, когда появится титульный экран
        const Q = [
          'Кто долго бежит от своего лица, однажды находит его на чужой обложке.',
          'В городе, где не звучат твои песни, впервые слышишь тишину. Она громче стадионов.',
          'Прошлое не прогоняет гостей из будущего. Оно их кормит — и смотрит, что они сделают с едой.',
          'Убийцу ищут в чужом городе те, кто боится найти его в себе.',
          'Всякая слава — лестница. Внизу на ней всегда кто-то спит.',
        ];
        gate.innerHTML = '<div style="max-width:min(620px,84vw);color:#cfc5b3;font-size:clamp(18px,2.2vw,26px);line-height:1.45;font-style:italic;text-align:center;opacity:0;transition:opacity 1.2s">' + Q[Math.floor(Math.random() * Q.length)] + '</div>';
        requestAnimationFrame(() => (gate.firstChild.style.opacity = '1'));
        const started = Date.now();
        const done = new MutationObserver(() => {
          if (!document.querySelector('.title, .title-bg, .ci')) return;
          done.disconnect();
          setTimeout(() => { gate.style.transition = 'opacity 0.8s'; gate.style.opacity = '0'; setTimeout(() => gate.remove(), 800); }, Math.max(0, 2600 - (Date.now() - started)));
        });
        done.observe(document.body, { childList: true, subtree: true });
        // код ссылается на свои файлы через import.meta.url — у расшифрованного кода адреса нет, подставляем папку assets
        const src = new TextDecoder().decode(js).replaceAll('import.meta.url', JSON.stringify(new URL('./assets/game.js', location.href).href));
        await import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      }
      form.onsubmit = async e => {
        e.preventDefault(); btn.disabled = true; err.textContent = '';
        try { await unlock(input.value) } catch { err.textContent = 'Неверный пароль'; btn.disabled = false; input.select() }
      };
      let saved = null; try { saved = localStorage.getItem('gspb-pw') } catch {}
      if (saved) unlock(saved).catch(() => {});
    </script>
  </body>
</html>
